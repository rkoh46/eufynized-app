name: Feature request
description: Something you'd like the Mac app to do
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes: { label: What would you like, description: "What it should do and when you'd use it." }
    validations: { required: true }
  - type: input
    id: cameras
    attributes: { label: Camera model(s) it matters for }
